# Pages CMS 설정 파일
# https://pagescms.org/docs/configuration/
#
# 이 저장소(yuristal-svg/yuristal1)의 data/works.json 을
# Pages CMS 관리 화면(app.pagescms.org)에서 폼으로 편집할 수 있게 해줍니다.
# index.html, 기존 works.json 내용, 이미지 파일은 이 설정으로 인해 전혀 바뀌지 않습니다.

media:
  - name: works-images
    label: 작품 이미지
    input: assets/images/works
    output: assets/images/works
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: false

content:
  - name: works
    label: 작품 목록 (works.json)
    type: file
    path: data/works.json
    format: json
    list: true
    fields:
      - name: id
        label: 작품 식별자 (ID)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "영문 소문자, 숫자, 하이픈(-)만 사용할 수 있어요. 예: father-memory"
        description: >-
          이 작품의 고유 번호예요. 새 작품을 만들 때만 입력하고,
          ⚠️ 한 번 저장한 뒤에는 절대 수정하지 마세요 — 사이트 코드가
          이 값으로 이미지·설명을 찾기 때문에, 바꾸면 연결이 끊어져요.

      - name: kind
        label: 작품 유형
        type: string
        required: true
        description: '예: "Documentary Film", "Book", "Writing Project · Facilitator"'

      - name: title_en
        label: 영문 제목
        type: string
        required: true

      - name: title_kr
        label: 한글 제목
        type: string
        required: true

      - name: date
        label: 제작 연도
        type: string
        description: '예: "2024", "2021 –" (진행 중인 작업은 하이픈으로 표시)'

      - name: tags
        label: 태그
        type: string
        list: true
        description: 작품 카드에 표시될 태그예요. 필요한 만큼 추가/삭제할 수 있어요.

      - name: desc
        label: 작품 설명
        type: text
        description: 카드를 클릭했을 때 팝업으로 뜨는 상세 설명이에요. 여러 줄로 작성할 수 있어요.

      - name: image
        label: 대표 이미지
        type: image
        options:
          media: works-images
        description: >-
          assets/images/works 폴더에 있는 기존 이미지 중에서 고르거나,
          새 이미지를 업로드할 수 있어요 (jpg, jpeg, png, webp).

      - name: link
        label: 링크 1 (구매처 등)
        type: string
        description: '예: https://... 또는 mailto:...  (없으면 비워두세요)'

      - name: link_label
        label: 링크 1 버튼 이름
        type: string
        description: '예: "교보문고에서 보기 · View on Kyobo Book"'

      - name: link2
        label: 링크 2 (구매처 등)
        type: string
        description: 두 번째 링크가 필요할 때만 입력하세요 (없으면 비워두세요).

      - name: link2_label
        label: 링크 2 버튼 이름
        type: string

  - name: about
    label: 소개 (About)
    type: file
    path: data/about.json
    format: json
    fields:
      - name: intro_kr_1
        label: 한국어 소개 첫 문단
        type: text
        required: true
        description: About 섹션 맨 위에 나오는 첫 번째 한국어 문단이에요.

      - name: intro_en
        label: 영문 소개 문단
        type: text
        required: true
        description: 한국어 첫 문단 바로 아래, 회색 이탤릭체로 표시되는 영문 문단이에요.

      - name: intro_kr_2
        label: 한국어 소개 두 번째 문단
        type: text
        required: true
        description: 영문 문단 아래에 나오는 두 번째 한국어 문단이에요.

      - name: tags
        label: 키워드 목록
        type: string
        list: true
        description: About 섹션 아래쪽에 알약 모양으로 표시되는 키워드예요.

  - name: selected-works
    label: 주요 작업 및 수상 (Selected Works & Awards)
    type: file
    path: data/selected-works.json
    format: json
    list: true
    fields:
      - name: date
        label: 제작 연도
        type: string
        required: true
        description: >-
          예: "2024", "2021 –". 같은 연도를 가진 항목들은 화면에서
          자동으로 한 그룹으로 묶여요 — 그룹으로 묶이길 원하는
          항목들은 목록에서 서로 붙어 있게 순서를 맞춰주세요.

      - name: title_en
        label: 영문 제목
        type: string
        description: 굵은 글씨로 먼저 표시되는 제목이에요. 비워두면 이 항목엔 작업 제목 줄 자체가 나타나지 않아요.

      - name: title_kr
        label: 한글 제목
        type: string
        description: 영문 제목 옆에 회색 글씨로 붙는 한글 제목이에요.

      - name: kind_en
        label: 영문 작업 유형
        type: string
        description: '예: "Documentary Film", "Writing Project" (없으면 비워두면 이 줄이 통째로 생략돼요)'

      - name: kind_kr
        label: 한글 작업 유형
        type: string

      - name: role_en
        label: 영문 역할
        type: string
        description: '예: "Director", "Facilitator" (없으면 비워두면 이 줄이 통째로 생략돼요)'

      - name: role_kr
        label: 한글 역할
        type: string

      - name: award_en
        label: 영문 수상명
        type: string
        description: >-
          이 작업으로 받은 상이 있으면 입력하세요. 입력하면 제목/유형/역할과는
          별도로 수상 내역이 한 줄 더 추가돼요. 수상이 없으면 비워두세요 —
          비워두면 빈 줄 없이 자동으로 생략돼요.

      - name: award_kr
        label: 한글 수상명
        type: string

      - name: org_en
        label: 영문 기관명
        type: string
        description: 수상 기관/행사명이에요. 수상명이 없으면 이것도 비워두세요.

      - name: org_kr
        label: 한글 기관명
        type: string

  - name: book
    label: 저서 (Book)
    type: file
    path: data/book.json
    fields:
      - name: cover_kr_image
        label: 한국어판 표지 이미지
        type: image
        options:
          media: works-images
        description: assets/images/works 폴더에서 기존 이미지를 고르거나 새로 업로드하세요.

      - name: cover_us_image
        label: 미국판 표지 이미지
        type: image
        options:
          media: works-images

      - name: cover_kr_caption
        label: 한국어판 표지 캡션
        type: string
        description: '예: "한국어판" — 표지 이미지 아래에 표시돼요.'

      - name: cover_us_caption
        label: 미국판 표지 캡션
        type: string
        description: '예: "미국판"'

      - name: title
        label: 책 제목
        type: string
        required: true

      - name: intro_en
        label: 영문 책 소개
        type: string
        description: '예: "A Korean Working Mom''s Table Diary" — 출간 정보 앞에 붙어요.'

      - name: publish_info
        label: 출간 정보
        type: string
        description: '예: "미국판 「Still Warm」으로 출간, 2025" — 영문 책 소개 뒤에 " — "로 이어 붙어요.'

      - name: desc_kr
        label: 한국어 설명
        type: text
        description: 책 소개 아래에 나오는 한국어 설명 문단이에요.

      - name: kyobo_link
        label: 교보문고 링크
        type: string

      - name: kyobo_label
        label: 교보문고 버튼 이름
        type: string
        description: '예: "교보문고에서 보기"'

      - name: amazon_link
        label: Amazon 링크
        type: string

      - name: amazon_label
        label: Amazon 버튼 이름
        type: string
        description: '예: "Amazon Kindle에서 보기"'

  - name: contact
    label: 연락처 (Contact)
    type: file
    path: data/contact.json
    fields:
      - name: instagram_label
        label: Instagram 표시 이름
        type: string
        description: '예: "Instagram — @summer_typewriter"'

      - name: instagram_url
        label: Instagram URL
        type: string

      - name: email_label
        label: 이메일 표시 이름
        type: string
        description: '예: "Email"'

      - name: email_address
        label: 이메일 주소
        type: string
        description: 화면에 표시도 되고, 클릭했을 때 이 주소로 메일쓰기 창이 열려요.
