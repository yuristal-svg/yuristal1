<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chair Archive Stories — Lee Hyangrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dim:#EFEEEA;
    --ink:#141414;
    --ink-soft:#4B4B4B;
    --stamp-text:#141414;
    --caption:#8C8C8A;
    --rule: rgba(20,20,20,0.14);
    --chair-yellow:#F5FF8C;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:300;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--ink); text-decoration:none;}
  .wide{
    max-width:1320px;
    margin:0 auto;
    padding:0 32px 120px;
  }

  /* ---------- Top nav ---------- */
  .top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:34px 0 0;
    font-size:13.5px;
  }
  .top-nav a{
    color:var(--ink-soft);
  }
  .top-nav a:hover{ color:var(--stamp-text); }

  /* ---------- Header ---------- */
  .page-head{
    margin:70px 0 20px;
  }
  .page-head h1{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:900;
    letter-spacing:-0.02em;
    font-size:clamp(34px, 5.4vw, 64px);
    line-height:1.04;
    margin:0;
  }
  .page-head .kr{
    display:block;
    font-size:0.42em;
    font-weight:600;
    color:var(--ink-soft);
    margin-top:10px;
    letter-spacing:0;
  }
  .page-intro{
    max-width:640px;
    font-size:15.5px;
    color:var(--ink-soft);
    margin:28px 0 0;
  }

  /* ---------- Chair grid ---------- */
  .chair-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:44px 28px;
    margin-top:70px;
  }
  .chair-card{
    display:flex;
    flex-direction:column;
  }
  .chair-number{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--stamp-text);
    margin-bottom:10px;
  }
  .chair-photo{
    width:32%;
    max-width:140px;
    aspect-ratio:3/4;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .chair-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .chair-photo .placeholder{
    font-size:9px;
    line-height:1.5;
    color:var(--caption);
    text-align:center;
    padding:0 6px;
  }
  .chair-excerpt{
    font-size:18px;
    line-height:1.85;
    color:var(--ink-soft);
    white-space:pre-wrap;
  }
  .chair-excerpt.empty{
    color:var(--caption);
    font-style:italic;
  }

  /* ---------- Chair 13 (closing) ---------- */
  .chair-13{
    grid-column:1 / -1;
    margin-top:26px;
    padding:56px 40px;
    background:var(--chair-yellow);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .chair-13 .num{
    font-weight:800;
    font-size:13px;
    letter-spacing:0.08em;
    margin-bottom:18px;
  }
  .chair-13 .quote{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-weight:700;
    font-size:clamp(20px, 2.6vw, 30px);
    max-width:640px;
    line-height:1.4;
  }
  .chair-13 .quote .kr{
    display:block;
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:0.56em;
    color:var(--ink-soft);
    margin-top:14px;
  }

  footer{
    padding:60px 0 0;
    font-size:12px;
    color:var(--caption);
  }

  @media (max-width:900px){
    .chair-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:560px){
    .chair-grid{ grid-template-columns:1fr; gap:52px; }
    .chair-13{ padding:44px 24px; }
  }
</style>
</head>
<body>

<div class="wide">

  <div class="top-nav">
    <a href="index.html">← Portfolio <span style="color:var(--caption);">이향림 포트폴리오로</span></a>
    <a href="index.html#contact">Contact</a>
  </div>

  <div class="page-head">
    <h1>CHAIR ARCHIVE STORIES<span class="kr">의자 이야기 아카이브</span></h1>
    <p class="page-intro">
      「WOMEN AND THEIR CHAIRS」에 참여한 열두 명의 여성이 자신이 반복해서
      앉는 의자를 사진으로 찍고, 그 의자에 담긴 기억과 경험을 글로 남겼습니다.
      아래는 그 글에서 발췌한 이야기들입니다.
    </p>
  </div>

  <div class="chair-grid" id="chairGrid"></div>

</div>

<script>
(function(){
  var grid = document.getElementById('chairGrid');

  function el(tag, className, text){
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function renderChairs(chairs){
    chairs.forEach(function(c){
      var card = el('div', 'chair-card');
      card.appendChild(el('div', 'chair-number', 'CHAIR ' + c.number));

      var photo = el('div', 'chair-photo');
      if (c.image){
        var img = document.createElement('img');
        img.src = c.image;
        img.alt = c.name + '의 의자';
        photo.appendChild(img);
      } else {
        photo.appendChild(el('div', 'placeholder', '사진이 아직 없어요 · No photo yet'));
      }
      card.appendChild(photo);

      // name intentionally not shown — only the CHAIR NN label above is public

      var excerpt = el('div', 'chair-excerpt' + (c.excerpt ? '' : ' empty'), c.excerpt || '아직 작성된 이야기가 없어요.');
      card.appendChild(excerpt);

      grid.appendChild(card);
    });

    // Chair 13 — the archive's invitation to future stories
    var chair13 = el('div', 'chair-13');
    chair13.appendChild(el('div', 'num', 'CHAIR 13'));
    var quote = el('div', 'quote');
    quote.appendChild(document.createTextNode('What story does your chair hold?'));
    quote.appendChild(el('span', 'kr', '당신의 의자는 어떤 이야기를 품고 있나요?'));
    chair13.appendChild(quote);
    grid.appendChild(chair13);
  }

  fetch('data/chair-stories.json')
    .then(function(res){ return res.json(); })
    .then(renderChairs)
    .catch(function(err){ console.error('chair-stories.json을 불러오지 못했습니다', err); });
})();
</script>

</body>
</html>
