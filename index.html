<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee Hyangrim — Writer · Filmmaker · Multidisciplinary Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500&family=Nanum+Pen+Script&family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dim:#EFEEEA;
    --ink:#141414;
    --ink-soft:#4B4B4B;
    --stamp:#141414;
    --stamp-text:#141414;
    --mint:#4B4B4B;
    --caption:#8C8C8A;
    --rule: rgba(20,20,20,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:300;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 28px;
  }
  h1,h2,h3{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-weight:800;
    margin:0;
    letter-spacing:-0.02em;
  }
  a{color:var(--ink); text-decoration:none;}

  .wide{
    max-width:1320px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- Masthead ---------- */
  .masthead-nav{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    padding:34px 0 0;
    font-size:13.5px;
    gap:24px;
  }
  .masthead-tagline{
    color:var(--ink-soft);
    max-width:520px;
    font-weight:400;
  }
  .masthead-links{
    display:flex;
    gap:28px;
    flex-shrink:0;
    font-weight:500;
  }
  .masthead-links a{
    color:var(--ink);
  }
  .masthead-links a:hover{ color:var(--stamp-text); }

  .masthead-name{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:100%;
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:900;
    letter-spacing:-0.02em;
    font-size:clamp(26px, 6.6vw, 82px);
    line-height:1;
    margin:90px 0 56px;
  }
  .masthead-name .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    width:100%;
  }
  .masthead-name .row-tight{
    justify-content:flex-start;
    gap:0;
  }
  .masthead-name span{
    white-space:nowrap;
  }

  /* ---------- Works grid ---------- */
  .work-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:36px 24px;
    padding-bottom:110px;
  }
  .work-item-wide{
    display:flex;
    flex-direction:column;
  }
  .work-meta-wide{
    font-size:14.5px;
    line-height:1.6;
    margin-bottom:8px;
    height:124px;
    overflow:hidden;
  }
  .work-meta-wide .kind{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .work-meta-wide .title{
    color:var(--ink);
    font-weight:600;
    font-size:16px;
  }
  .work-meta-wide .title-en,
  .work-meta-wide .title-kr{
    display:block;
  }
  .work-meta-wide .title-kr{
    font-weight:500;
    color:var(--ink-soft);
    font-size:14px;
    margin-top:2px;
  }
  .work-meta-wide .date{
    color:var(--caption);
    margin-top:4px;
    font-size:13px;
  }
  .work-thumb{
    width:100%;
    aspect-ratio:3/4;
    background:var(--paper-dim);
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .work-item-wide{
    cursor:pointer;
  }
  .work-thumb img.custom-img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .work-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  /* poster-style thumb: yellow, oversized cropped type */
  .thumb-poster{
    background:#F5FF8C;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thumb-poster .stack{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:900;
    color:#141414;
    text-align:center;
    line-height:0.98;
    letter-spacing:-0.01em;
    font-size:15%;
    width:120%;
  }
  .thumb-poster .stack .en{
    font-size:18px;
    letter-spacing:0.02em;
    display:block;
  }
  .thumb-poster .stack .kr{
    font-size:26px;
    display:block;
    margin-top:10px;
  }
  /* book cover tile */
  .thumb-book{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14%;
  }
  .thumb-book img{
    width:auto;
    height:100%;
    object-fit:contain;
    box-shadow:0 14px 30px rgba(24,24,24,0.18);
  }
  /* wordmark tile */
  .thumb-wordmark{
    background:#F5FF8C;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .thumb-wordmark .rot{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:800;
    color:#141414;
    font-size:26px;
    line-height:1.3;
    letter-spacing:0.01em;
    transform:rotate(-8deg);
    text-align:center;
    width:150%;
  }
  /* ruled-notebook tile */
  .thumb-notebook{
    background:#F5FF8C;
    border:1px solid rgba(20,20,20,0.14);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thumb-notebook::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent, transparent 27px,
      rgba(20,20,20,0.14) 27px, rgba(20,20,20,0.14) 28px
    );
  }
  .thumb-notebook .word{
    position:relative;
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:800;
    font-size:22px;
    line-height:1.3;
    text-align:center;
    padding:0 14%;
    background:#F5FF8C;
    color:#141414;
  }

  @media (max-width:980px){
    .work-grid{ grid-template-columns:repeat(2, 1fr); gap:56px 24px; }
    .masthead-name{ margin:56px 0 40px; }
  }
  @media (max-width:520px){
    .masthead-nav{ flex-direction:column; gap:10px; }
    .work-grid{ grid-template-columns:1fr; gap:72px; }
    .work-meta-wide{ height:auto; overflow:visible; }
    .masthead-name{
      flex-direction:column;
      align-items:flex-start;
      gap:6px;
      font-size:clamp(30px, 11vw, 44px);
    }
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(24,24,24,0.5);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:6vh 20px;
    overflow-y:auto;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:#fff;
    max-width:720px;
    width:100%;
    padding:44px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:20px;
    right:20px;
    font-size:22px;
    line-height:1;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .modal-media{
    width:100%;
    aspect-ratio:16/10;
    background:var(--paper-dim);
    margin-bottom:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .modal-media img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .modal-media .placeholder{
    font-size:13px;
    color:var(--caption);
  }
  .modal-byline{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .modal-date{
    font-size:13px;
    color:var(--caption);
    margin-bottom:22px;
  }
  .modal-title{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:26px;
    font-weight:800;
    margin-bottom:18px;
  }
  .modal-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .modal-tags span{
    font-size:11.5px;
    letter-spacing:0.05em;
    padding:6px 12px;
    border:1px solid var(--rule);
    border-radius:3px;
    color:var(--ink-soft);
  }
  .modal-desc{
    font-size:15.5px;
    color:var(--ink-soft);
    line-height:1.85;
    white-space:pre-wrap;
    margin-bottom:28px;
  }
  .modal-buy{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14.5px;
    color:var(--ink);
    border-bottom:1px solid var(--stamp-text);
    padding-bottom:2px;
  }
  .modal-buy .arrow{ color:var(--stamp-text); }

  /* ---------- Sections ---------- */
  section{
    padding:96px 0;
    border-top:1px solid var(--rule);
  }
  .section-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:44px;
  }
  .mark{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--stamp);
    flex-shrink:0;
    transform:translateY(-2px);
  }
  .section-head h2{
    font-size:26px;
  }
  .bi{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-size:14px;
    font-weight:300;
    color:var(--caption);
    letter-spacing:0;
  }
  .hero-eyebrow-kr{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:-10px;
    margin-bottom:14px;
    font-weight:300;
    letter-spacing:0;
  }

  /* about */
  .about-body p{
    font-size:16.5px;
    color:var(--ink-soft);
    max-width:560px;
  }
  .about-body p + p{ margin-top:18px; }
  .about-en{
    font-size:14.5px;
    color:var(--caption);
    font-style:italic;
    margin-top:8px;
  }

  /* ---------- Landing splash ---------- */
  .landing{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:100vh;
    height:100dvh;
    display:flex;
    overflow:hidden;
    margin:0;
    padding:0;
  }
  #site{
    display:none;
  }
  .landing-half{
    flex:1 1 50%;
    height:100%;
    margin:0;
  }
  .landing-half.left{
    background:#F5FF8C;
  }
  .landing-half.right{
    background:#FFFFFF;
  }
  .landing-name{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    gap:5px;
    text-align:center;
    text-decoration:none;
    z-index:2;
  }
  .landing-name .kr,
  .landing-name .hj,
  .landing-name .en{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-weight:900;
    letter-spacing:-0.01em;
    font-size:clamp(36px, 6.5vw, 73px);
    color:#141414;
    white-space:nowrap;
  }
  @media (max-width:600px){
    .landing-name .kr,
    .landing-name .hj,
    .landing-name .en{
      font-size:clamp(29px, 10.4vw, 47px);
    }
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:32px;
  }
  .tag{
    font-size:13px;
    padding:7px 14px;
    border:1px solid var(--rule);
    border-radius:999px;
    color:var(--ink-soft);
  }

  /* work items */
  .work-list{
    display:flex;
    flex-direction:column;
  }
  .work-item{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    padding:30px 0;
    border-top:1px solid var(--rule);
  }
  .work-item:first-child{ border-top:none; padding-top:0; }
  .work-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  .work-title{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:20px;
    font-weight:500;
  }
  .work-period{
    font-size:12.5px;
    color:var(--caption);
    letter-spacing:0.04em;
    white-space:nowrap;
  }
  .work-desc{
    font-size:15px;
    color:var(--ink-soft);
    max-width:560px;
  }
  .work-role{
    font-size:12.5px;
    color:var(--mint);
    font-weight:500;
    letter-spacing:0.02em;
  }

  /* book */
  .book{
    display:grid;
    grid-template-columns:308px 1fr;
    gap:32px;
    align-items:start;
  }
  .book-covers{
    display:flex;
    gap:20px;
    flex-shrink:0;
  }
  .book-cover{
    width:140px;
    border:1px solid var(--rule);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(24,24,24,0.08);
    flex-shrink:0;
  }
  .book-cover img{
    display:block;
    width:100%;
    height:auto;
  }
  .book-cover-label{
    margin-top:10px;
    font-size:11.5px;
    color:var(--caption);
    text-align:center;
    letter-spacing:0.04em;
  }
  .book-title{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:22px;
    margin-bottom:6px;
  }
  .book-sub{
    font-size:13.5px;
    color:var(--caption);
    margin-bottom:16px;
  }
  .book-desc{
    font-size:15px;
    color:var(--ink-soft);
    max-width:480px;
  }
  .book-buy-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    margin-top:18px;
  }
  .book-buy{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:14.5px;
    color:var(--ink);
    border-bottom:1px solid var(--stamp-text);
    padding-bottom:2px;
  }
  .book-buy .arrow{
    color:var(--stamp-text);
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
  }

  /* contact */
  .contact h2{
    font-size:30px;
    max-width:480px;
    margin-bottom:24px;
  }
  .contact-links{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .contact-link{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-top:1px solid var(--rule);
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:17px;
    transition:opacity .15s ease;
  }
  .contact-link:last-child{ border-bottom:1px solid var(--rule); }
  .contact-link:hover{ opacity:0.6; }
  .contact-link .arrow{
    font-family:'Libre Franklin','Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--stamp-text);
  }

  footer{
    padding:40px 0 60px;
    font-size:12px;
    color:var(--caption);
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:560px){
    section{ padding:64px 0; }
    .book{ grid-template-columns:1fr; }
    .book-covers{ gap:14px; }
    .book-cover{ width:120px; }
    footer{ flex-direction:column; gap:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }

  /* ---------- Selected works & awards ---------- */
  .timeline-year{
    display:grid;
    grid-template-columns:76px 1fr;
    gap:20px;
    padding:26px 0;
    border-top:1px solid var(--rule);
  }
  .timeline-year:first-child{ border-top:none; padding-top:0; }
  .year-label{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:18px;
    color:var(--stamp-text);
    font-weight:700;
  }
  .year-entries{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .entry-title{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:17px;
    font-weight:500;
  }
  .entry-type{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .entry-role{
    font-size:12.5px;
    color:var(--mint);
    font-weight:500;
    margin-top:4px;
  }

  /* ---------- Artist statement ---------- */
  .statement-head{
    margin-bottom:8px;
  }
  .statement-title{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:24px;
    margin-bottom:6px;
  }
  .statement-sub{
    font-size:13.5px;
    color:var(--caption);
    font-style:italic;
    margin-bottom:32px;
  }
  .statement-body p{
    font-size:16px;
    color:var(--ink-soft);
    max-width:600px;
    margin:0 0 20px;
  }
  .statement-body strong{
    color:var(--ink);
    font-weight:500;
  }
  .stmt-pair{
    margin-bottom:28px;
  }
  .stmt-en{
    font-size:16px;
    color:var(--ink);
    max-width:600px;
    margin:0 0 8px;
  }
  .stmt-kr{
    font-size:14.5px;
    font-style:italic;
    color:var(--ink-soft);
    max-width:600px;
    margin:0;
  }
  .stmt-en strong, .stmt-kr strong{
    font-weight:500;
    font-style:normal;
    color:inherit;
  }
  .statement-pull{
    font-family:'Libre Franklin','Noto Serif KR', serif;
    font-size:19px;
    color:var(--ink);
    max-width:520px;
    margin:32px 0;
    padding-left:18px;
    border-left:2px solid var(--stamp-text);
  }
  .statement-credit{
    margin-top:36px;
    padding-top:24px;
    border-top:1px solid var(--rule);
    font-size:13.5px;
    color:var(--caption);
    line-height:1.9;
  }
  .statement-credit b{
    color:var(--ink-soft);
    font-weight:500;
  }

  @media (max-width:560px){
    .timeline-year{ grid-template-columns:1fr; gap:8px; }
    .year-label{ margin-bottom:4px; }
  }
</style>
</head>
<body>

  <!-- LANDING SPLASH -->
  <section class="landing" id="landing">
    <div class="landing-half left"></div>
    <div class="landing-half right"></div>
    <a class="landing-name" href="#site">
      <span class="kr">이향림 <span class="hj">李香林</span></span>
      <span class="en">LEE HYANGRIM</span>
    </a>
  </section>

  <div id="site">

  <!-- MASTHEAD -->
  <div class="wide">
    <div class="masthead-nav">
      <div class="masthead-links">
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </div>
    </div>

    <div class="masthead-name">
      <div class="row row-tight"><span>이향림</span><span>李香林</span></div>
      <div class="row"><span>LEE HYANGRIM</span></div>
    </div>

    <div class="work-grid" id="workGrid"></div>


  </div>
  <div class="wrap">

  <!-- ABOUT -->
  <section id="about">
    <div class="section-head"><div class="mark"></div><h2>About <span class="bi">소개</span></h2></div>
    <div class="about-body" id="aboutBody"></div>
    <div class="tags" id="aboutTags"></div>
  </section>

  <!-- SELECTED WORKS & AWARDS -->
  <section id="works">
    <div class="section-head"><div class="mark"></div><h2>Selected Works &amp; Awards <span class="bi">주요 작업 및 수상</span></h2></div>
    <div id="worksTimeline"></div>
  </section>

  <!-- BOOK -->
  <section id="book">
    <div class="section-head"><div class="mark"></div><h2>Book <span class="bi">저서</span></h2></div>
    <div class="book">
      <div class="book-covers" id="bookCovers"></div>
      <div>
        <div class="book-title" id="bookTitle"></div>
        <div class="book-sub" id="bookSub"></div>
        <div class="book-desc" id="bookDesc"></div>
        <div class="book-buy-group" id="bookBuyGroup"></div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="contact">
    <div class="section-head"><div class="mark"></div><h2>Contact <span class="bi">연락처</span></h2></div>
    <div class="contact-links" id="contactLinks"></div>
  </section>

  <footer>
    <span>Lee Hyangrim <span class="bi" style="margin-left:6px;">이향림</span></span>
    <span>© 2026</span>
  </footer>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-byline" id="modalByline">By Lee Hyangrim</div>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div id="modalBuyGroup" style="display:flex; flex-direction:column; align-items:flex-start; gap:10px;">
      <a class="modal-buy" id="modalBuy" target="_blank" rel="noopener" style="display:none;">
        <span id="modalBuyLabel">구매처로 이동 <span class="bi">View Purchase Link</span></span><span class="arrow">→</span>
      </a>
      <a class="modal-buy" id="modalBuy2" target="_blank" rel="noopener" style="display:none;">
        <span id="modalBuyLabel2"></span><span class="arrow">→</span>
      </a>
    </div>
  </div>
</div>

<script>
(function(){
  var WORKS = [];
  var grid = document.getElementById('workGrid');
  var currentWorkId = null;

  // simple built-in placeholder designs for works that have no photo yet.
  // keyed by work id — edit this if you add a new work with no image.
  var PLACEHOLDER = {
    'father-memory': '<div class="work-thumb thumb-poster"><div class="stack"><span class="en">A FATHER\'S<br>MEMORY</span><span class="kr">아빠의 기억</span></div></div>',
    'women-chairs': '<div class="work-thumb thumb-wordmark"><div class="rot">WOMEN<br>AND<br>THEIR<br>CHAIRS</div></div>',
    'self-care-writing': '<div class="work-thumb thumb-notebook"><div class="word">나를 돌보는<br>글쓰기</div></div>',
    'nakuzak': '<div class="work-thumb thumb-poster"><div class="stack"><span class="en">6 WOMEN<br>CREATORS</span><span class="kr">나크작</span></div></div>',
    'spy-writing': '<div class="work-thumb thumb-wordmark"><div class="rot">스파이<br>글쓰기</div></div>'
  };

  function render(){
    grid.innerHTML = '';
    WORKS.forEach(function(w){
      var item = document.createElement('div');
      item.className = 'work-item-wide';
      item.dataset.id = w.id;

      var meta = document.createElement('div');
      meta.className = 'work-meta-wide';
      meta.innerHTML =
        '<div class="kind">' + w.kind + '</div>' +
        '<div class="title"><span class="title-en">' + w.title_en + '</span><span class="title-kr">' + w.title_kr + '</span></div>' +
        '<div class="date">' + w.date + '</div>';
      item.appendChild(meta);

      var thumbWrap = document.createElement('div');
      if (w.image) {
        thumbWrap.className = 'work-thumb';
        var img = document.createElement('img');
        img.className = 'custom-img';
        img.src = w.image;
        img.alt = w.title_en;
        thumbWrap.appendChild(img);
      } else {
        thumbWrap.innerHTML = PLACEHOLDER[w.id] || '<div class="work-thumb thumb-poster"></div>';
        thumbWrap = thumbWrap.firstElementChild;
      }
      item.appendChild(thumbWrap);

      thumbWrap.addEventListener('click', function(){ openModal(w.id); });
      meta.addEventListener('click', function(){ openModal(w.id); });

      grid.appendChild(item);
    });
  }

  function findWork(id){ return WORKS.find(function(w){ return w.id === id; }); }

  function openModal(id){
    var w = findWork(id);
    currentWorkId = id;
    var media = document.getElementById('modalMedia');
    media.innerHTML = w.image
      ? '<img src="' + w.image + '" alt="">'
      : '<div class="placeholder">이미지가 아직 없어요 · No image yet</div>';
    document.getElementById('modalDate').textContent = w.date;
    document.getElementById('modalTitle').innerHTML = w.title_en + '<br><span style="font-size:0.7em; color:var(--ink-soft); font-weight:500;">' + w.title_kr + '</span>';
    document.getElementById('modalTags').innerHTML = w.tags.map(function(t){ return '<span>' + t + '</span>'; }).join('');
    document.getElementById('modalDesc').textContent = w.desc || '아직 작성된 설명이 없어요.';
    var buy = document.getElementById('modalBuy');
    if (w.link) {
      buy.href = w.link;
      buy.style.display = 'inline-flex';
      document.getElementById('modalBuyLabel').innerHTML = w.link_label
        ? w.link_label.replace(' · ', ' <span class="bi">') + '</span>'
        : '구매처로 이동 <span class="bi">View Purchase Link</span>';
    } else {
      buy.style.display = 'none';
    }
    var buy2 = document.getElementById('modalBuy2');
    if (w.link2) {
      buy2.href = w.link2;
      buy2.style.display = 'inline-flex';
      document.getElementById('modalBuyLabel2').innerHTML = w.link2_label
        ? w.link2_label.replace(' · ', ' <span class="bi">') + '</span>'
        : '다른 구매처로 이동 <span class="bi">View Alternate Link</span>';
    } else {
      buy2.style.display = 'none';
    }

    document.getElementById('modalOverlay').classList.add('open');
  }

  document.getElementById('modalClose').addEventListener('click', function(){
    document.getElementById('modalOverlay').classList.remove('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('open');
  });

  fetch('data/works.json')
    .then(function(res){ return res.json(); })
    .then(function(data){ WORKS = data; render(); })
    .catch(function(err){ console.error('works.json을 불러오지 못했습니다', err); });
})();
</script>

<script>
(function(){
  // ---- helpers: build DOM safely (no innerHTML with raw data) ----
  function el(tag, className, text){
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  // Builds a "<primary text> <span class=bi>secondary text</span>" line.
  // Returns null if primary is empty, so callers can skip the whole line.
  function biLine(className, primary, secondary){
    if (!primary) return null;
    var div = el('div', className);
    div.appendChild(document.createTextNode(secondary ? primary + ' ' : primary));
    if (secondary){
      div.appendChild(el('span', 'bi', secondary));
    }
    return div;
  }

  // ---------- About ----------
  function renderAbout(data){
    var body = document.getElementById('aboutBody');
    body.appendChild(el('p', null, data.intro_kr_1 || ''));
    body.appendChild(el('p', 'about-en', data.intro_en || ''));
    body.appendChild(el('p', null, data.intro_kr_2 || ''));

    var tagsWrap = document.getElementById('aboutTags');
    (data.tags || []).forEach(function(t){
      tagsWrap.appendChild(el('span', 'tag', t));
    });
  }

  // ---------- Selected Works & Awards ----------
  function renderSelectedWorks(items){
    var container = document.getElementById('worksTimeline');
    var i = 0;
    while (i < items.length){
      var date = items[i].date;
      var yearDiv = el('div', 'timeline-year');
      yearDiv.appendChild(el('div', 'year-label', date));
      var entries = el('div', 'year-entries');

      while (i < items.length && items[i].date === date){
        var it = items[i];

        // work part (title/kind/role) — its own wrapping div, only if a title exists
        if (it.title_en){
          var workDiv = el('div');
          var t = biLine('entry-title', it.title_en, it.title_kr);
          var k = biLine('entry-type', it.kind_en, it.kind_kr);
          var r = biLine('entry-role', it.role_en, it.role_kr);
          if (t) workDiv.appendChild(t);
          if (k) workDiv.appendChild(k);
          if (r) workDiv.appendChild(r);
          entries.appendChild(workDiv);
        }

        // award part (award/org) — separate sibling wrapping div, only if an award exists
        if (it.award_en){
          var awardDiv = el('div');
          var a = biLine('entry-title', it.award_en, it.award_kr);
          var o = biLine('entry-type', it.org_en, it.org_kr);
          if (a) awardDiv.appendChild(a);
          if (o) awardDiv.appendChild(o);
          entries.appendChild(awardDiv);
        }

        i++;
      }

      yearDiv.appendChild(entries);
      container.appendChild(yearDiv);
    }
  }

  // ---------- Book ----------
  function renderBook(data){
    var covers = document.getElementById('bookCovers');

    function coverBlock(src, alt, captionKr, captionEnStatic){
      var wrap = el('div');
      var coverDiv = el('div', 'book-cover');
      var img = document.createElement('img');
      img.src = src || '';
      img.alt = alt || '';
      coverDiv.appendChild(img);
      wrap.appendChild(coverDiv);

      var label = el('div', 'book-cover-label');
      label.appendChild(document.createTextNode((captionKr || '') + ' '));
      label.appendChild(el('span', 'bi', captionEnStatic));
      wrap.appendChild(label);
      return wrap;
    }

    covers.appendChild(coverBlock(
      data.cover_kr_image,
      (data.title || '') + ', 한국어판 표지',
      data.cover_kr_caption,
      'Korean Edition'
    ));
    covers.appendChild(coverBlock(
      data.cover_us_image,
      (data.title || '') + ', US edition cover',
      data.cover_us_caption,
      'US Edition'
    ));

    document.getElementById('bookTitle').textContent = data.title || '';
    document.getElementById('bookSub').textContent =
      (data.intro_en || '') + (data.intro_en && data.publish_info ? ' — ' : '') + (data.publish_info || '');
    document.getElementById('bookDesc').textContent = data.desc_kr || '';

    var buyGroup = document.getElementById('bookBuyGroup');
    function buyLink(href, labelKr, labelEnStatic){
      if (!href) return null;
      var a = document.createElement('a');
      a.className = 'book-buy';
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      var span = el('span');
      span.appendChild(document.createTextNode((labelKr || '') + ' '));
      span.appendChild(el('span', 'bi', labelEnStatic));
      a.appendChild(span);
      a.appendChild(el('span', 'arrow', '→'));
      return a;
    }
    var kyobo = buyLink(data.kyobo_link, data.kyobo_label, 'View on Kyobo Book');
    if (kyobo) buyGroup.appendChild(kyobo);
    var amazon = buyLink(data.amazon_link, data.amazon_label, 'View on Amazon Kindle');
    if (amazon) buyGroup.appendChild(amazon);
  }

  // ---------- Contact ----------
  function renderContact(data){
    var wrap = document.getElementById('contactLinks');

    if (data.instagram_url){
      var ig = document.createElement('a');
      ig.className = 'contact-link';
      ig.href = data.instagram_url;
      ig.target = '_blank';
      ig.rel = 'noopener';
      ig.appendChild(el('span', null, data.instagram_label || ''));
      ig.appendChild(el('span', 'arrow', '→'));
      wrap.appendChild(ig);
    }

    if (data.email_address){
      var em = document.createElement('a');
      em.className = 'contact-link';
      em.href = 'mailto:' + data.email_address;
      var emSpan = el('span');
      emSpan.appendChild(document.createTextNode((data.email_label || '') + ' '));
      emSpan.appendChild(el('span', 'bi', data.email_address));
      em.appendChild(emSpan);
      em.appendChild(el('span', 'arrow', '→'));
      wrap.appendChild(em);
    }
  }

  Promise.all([
    fetch('data/about.json').then(function(r){ return r.json(); }),
    fetch('data/selected-works.json').then(function(r){ return r.json(); }),
    fetch('data/book.json').then(function(r){ return r.json(); }),
    fetch('data/contact.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    renderAbout(results[0]);
    renderSelectedWorks(results[1]);
    renderBook(results[2]);
    renderContact(results[3]);
  }).catch(function(err){
    console.error('About/Works/Book/Contact 데이터를 불러오지 못했습니다', err);
  });
})();
</script>

<script>
